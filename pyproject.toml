[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.2",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "soundfile>=0.13.1",
    "torch>=2.14.1",
    "transformers==5.18.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
transformers = [{ index = "pypi" }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
