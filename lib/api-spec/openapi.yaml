openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mateen/review-access:
    get:
      operationId: getReviewAccess
      responses:
        "200":
          description: Server verified permissions and account protections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewAccess" }
  /mateen/teacher/documents/upload:
    post:
      operationId: requestQualificationUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationUploadInput" }
      responses:
        "200":
          description: Short lived direct private upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationUpload" }
  /mateen/teacher/documents/{documentId}/complete:
    post:
      operationId: completeQualificationUpload
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Validated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationDocument" }
  /mateen/teacher/documents/{documentId}:
    delete:
      operationId: removeQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed from next submission }
  /mateen/documents/{documentId}/download:
    get:
      operationId: downloadQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Protected attachment bytes, never public
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /mateen/teacher/submit:
    post:
      operationId: submitTeacherApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionInput" }
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/admin/teachers:
    get:
      operationId: getTeacherReviews
      responses:
        "200":
          description: Qualification reviewer queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeacherReview" } }
  /mateen/admin/teachers/{userId}/decision:
    post:
      operationId: decideTeacherApplication
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionInput" }
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReview" }
  /mateen/admin/sources:
    get:
      operationId: getSourceReviews
      responses:
        "200":
          description: Versioned Nawawi source review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceVersion" } }
    post:
      operationId: createSourceVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceVersionInput" }
      responses:
        "201":
          description: New unapproved immutable version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/sources/{versionId}/decision:
    post:
      operationId: decideSourceVersion
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceDecisionInput" }
      responses:
        "200":
          description: Scientific and rights decision on exact version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/audit:
    get:
      operationId: getReviewAudit
      responses:
        "200":
          description: Authorized append only review history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
  /mateen/catalog:
    get:
      operationId: getCatalog
      responses:
        "200":
          description: First-release catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogText" }
  /mateen/texts/{textId}:
    get:
      operationId: getStudyText
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available text and source records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyText" }
  /mateen/profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Current authenticated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /mateen/progress:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Own study progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/progress/{textId}:
    put:
      operationId: saveProgress
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressInput" }
      responses:
        "200":
          description: Saved progress, not an assessment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Actual study summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /mateen/scholars:
    get:
      operationId: getScholars
      responses:
        "200":
          description: Approved public teachers only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scholar" }
  /mateen/referrals:
    get:
      operationId: getReferrals
      responses:
        "200":
          description: Own referrals only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
  /mateen/teacher:
    get:
      operationId: getTeacher
      responses:
        "200":
          description: Own teacher application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
    put:
      operationId: saveTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherInput" }
      responses:
        "200":
          description: Saved application; approval cannot be self-assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Honest release readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
  /mateen/assistant/questions:
    get:
      operationId: getMateenAssistantQuestions
      responses:
        "200":
          description: Current student's persisted assistant questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantQuestion" }
    post:
      operationId: askMateenAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantQuestionInput" }
      responses:
        "201":
          description: Persisted grounded answer or abstention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantQuestion" }
        "503": { description: Assistant disabled or not ready }
  /mateen/assistant/readiness:
    get:
      operationId: getMateenAssistantReadiness
      responses:
        "200":
          description: Assistant provider, source and evaluation gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/assistant/questions/{questionId}/referral-preview:
    get:
      operationId: getMateenReferralPreview
      parameters:
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Explicit share preview and available approved teachers; nothing is shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralPreview" }
        "404": { description: Own persisted abstained assistant question not found }
  /mateen/assistant/questions/{questionId}/referral:
    post:
      operationId: referMateenAssistantQuestion
      parameters:
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralConsentInput" }
      responses:
        "201":
          description: Referral created after explicit consent and transactional teacher revalidation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReferralSummary" }
        "409": { description: Teacher unavailable or referral already exists }
  /mateen/conversations:
    get:
      operationId: getMateenConversations
      responses:
        "200":
          description: Conversations visible to current participant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyConversation" }
  /mateen/conversations/{conversationId}/messages:
    get:
      operationId: getMateenConversationMessages
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owned conversation messages and citations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyMessage" }
        "404": { description: Conversation not found }
    post:
      operationId: sendMateenFollowUp
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Persisted participant message and assistant response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantQuestion" }
        "404": { description: Conversation not found }
  /mateen/conversations/{conversationId}/status:
    get:
      operationId: getMateenConversationStatus
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation and referral polling state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationStatus" }
        "404": { description: Conversation not found }
  /mateen/teacher/referrals:
    get:
      operationId: getMateenTeacherReferrals
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, answered, closed] }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Referrals assigned to current approved teacher
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherReferral" }
  /mateen/teacher/referrals/{referralId}/status:
    patch:
      operationId: updateMateenReferralStatus
      parameters:
        - in: path
          name: referralId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralStatusInput" }
      responses:
        "200":
          description: Referral status changed without deleting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReferral" }
        "404": { description: Referral not found }
  /mateen/teacher/referrals/{referralId}/messages:
    post:
      operationId: replyMateenReferral
      parameters:
        - in: path
          name: referralId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Teacher text reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyMessage" }
        "404": { description: Referral not found }
  /mateen/notifications:
    get:
      operationId: getMateenNotifications
      responses:
        "200":
          description: Current user's scholarly notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyNotification" }
  /mateen/notifications/state:
    get:
      operationId: getMateenNotificationState
      responses:
        "200":
          description: Notification polling cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /mateen/notifications/{notificationId}/read:
    patch:
      operationId: markMateenNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Own notification marked as read; returns refreshed polling state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
        "404": { description: Notification not found }
  /mateen/admin/scholarly/sources:
    get:
      operationId: listScholarlySources
      responses:
        "200":
          description: Admin source/version inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlySource" }
    post:
      operationId: createScholarlySource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlySourceInput" }
      responses:
        "201":
          description: New source version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/passages:
    get:
      operationId: listScholarlyPassages
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Admin-only source passage text and distinct printed/PDF pages for review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyPassage" }
        "404": { description: Source not found }
    post:
      operationId: createScholarlyPassage
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyPassagesInput" }
      responses:
        "201": { description: Passages staged for review }
  /mateen/admin/scholarly/sources/{sourceId}/review:
    post:
      operationId: reviewScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyReviewInput" }
      responses:
        "200":
          description: Review result and index readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/index:
    post:
      operationId: indexScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIndexInput" }
      responses:
        "200":
          description: Reviewed passages indexed; corpus change invalidates evaluations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/withdraw:
    post:
      operationId: withdrawScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyWithdrawalInput" }
      responses:
        "200":
          description: Source withdrawn from future retrieval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/assistant/issues:
    post:
      operationId: reportScholarlyIssue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIssueInput" }
      responses:
        "201":
          description: Persisted own answer issue report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/issues:
    get:
      operationId: listScholarlyIssues
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, reviewed, resolved] }
      responses:
        "200":
          description: Reported answer and citation issues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/issues/{issueId}:
    patch:
      operationId: moderateScholarlyIssue
      parameters:
        - in: path
          name: issueId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIssueModerationInput" }
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/config:
    get:
      operationId: getScholarlyConfig
      responses:
        "200":
          description: Model pin, provider readiness and evaluation gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
    put:
      operationId: updateScholarlyConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyConfigInput" }
      responses:
        "200":
          description: Audited model configuration update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/admin/scholarly/evaluations:
    post:
      operationId: recordScholarlyEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyEvaluationInput" }
      responses:
        "201":
          description: Evaluation record; positive evaluation enables assistant gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/admin/scholarly/audit:
    get:
      operationId: listScholarlyAudit
      responses:
        "200":
          description: Sensitive decisions with actor, reason and date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyAuditEvent" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CatalogText:
      type: object
      required: [id, title, track, level, status, description, hadithCount]
      properties:
        id: { type: string }
        title: { type: string }
        track: { type: string }
        level: { type: string }
        status: { type: string, enum: [available, coming_soon] }
        description: { type: string }
        hadithCount: { type: integer }
    Hadith:
      type: object
      required: [id, number, title, text, sourceUrl, sourcePage]
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        text: { type: string }
        sourceUrl: { type: string }
        sourcePage: { type: integer }
        sourceVersionId: { type: string }
        reviewStatus: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
        viewerPage: { type: integer }
    StudyText:
      type: object
      required: [id, title, author, sourceUrl, sourceStatus, hadiths]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        sourceUrl: { type: string }
        sourceStatus: { type: string, enum: [retrieved_pending_review, approved, unavailable] }
        hadiths:
          type: array
          items: { $ref: "#/components/schemas/Hadith" }
    Profile:
      type: object
      required: [id, name, role, onboarded]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher] }
        onboarded: { type: boolean }
    ProfileInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        role: { type: string, enum: [student, teacher] }
    ProgressInput:
      type: object
      required: [currentHadith, completedIds, bookmarkedIds]
      properties:
        currentHadith: { type: integer, minimum: 1, maximum: 42 }
        completedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
        bookmarkedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
    StudyProgress:
      type: object
      required: [textId, currentHadith, completedIds, bookmarkedIds, updatedAt]
      properties:
        textId: { type: string }
        currentHadith: { type: integer }
        completedIds:
          type: array
          items: { type: integer }
        bookmarkedIds:
          type: array
          items: { type: integer }
        updatedAt: { type: string }
    Dashboard:
      type: object
      required: [studiedCount, totalCount, bookmarkedCount, lastHadith, lastStudiedAt]
      properties:
        studiedCount: { type: integer }
        totalCount: { type: integer }
        bookmarkedCount: { type: integer }
        lastHadith: { type: integer }
        lastStudiedAt: { type: [string, "null"] }
    Scholar:
      type: object
      required: [id, name, biography, specialties, available]
      properties:
        id: { type: string }
        name: { type: string }
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
    Referral:
      type: object
      required: [id, question, reason, status, createdAt]
      properties:
        id: { type: string }
        question: { type: string }
        reason: { type: string }
        status: { type: string }
        createdAt: { type: string }
    TeacherInput:
      type: object
      required: [biography, specialties, available]
      properties:
        biography: { type: string, maxLength: 2000 }
        specialties: { type: string, maxLength: 300 }
        available: { type: boolean }
    TeacherApplication:
      type: object
      required: [biography, specialties, available, status]
      properties:
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
        status: { type: string, enum: [draft, pending_review, approved, needs_information, rejected] }
        revision: { type: integer }
        reason: { type: string }
        submittedAt: { type: ["string", "null"] }
        documents: { type: array, items: { $ref: "#/components/schemas/QualificationDocument" } }
        history: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
    ReviewAccess:
      type: object
      required: [contentReviewer, qualificationReviewer, verifiedEmail, mfaEnabled, secureSession]
      properties:
        contentReviewer: { type: boolean }
        qualificationReviewer: { type: boolean }
        verifiedEmail: { type: boolean }
        mfaEnabled: { type: boolean }
        secureSession: { type: boolean }
    RevisionInput:
      type: object
