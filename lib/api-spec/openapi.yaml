openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mateen/review-access:
    get:
      operationId: getReviewAccess
      responses:
        "200":
          description: Server verified permissions and account protections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewAccess" }
  /mateen/teacher/documents/upload:
    post:
      operationId: requestQualificationUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationUploadInput" }
      responses:
        "200":
          description: Short lived direct private upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationUpload" }
  /mateen/teacher/documents/{documentId}/complete:
    post:
      operationId: completeQualificationUpload
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Validated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationDocument" }
  /mateen/teacher/documents/{documentId}:
    delete:
      operationId: removeQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed from next submission }
  /mateen/documents/{documentId}/download:
    get:
      operationId: downloadQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Protected attachment bytes, never public
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /mateen/teacher/submit:
    post:
      operationId: submitTeacherApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionInput" }
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/admin/teachers:
    get:
      operationId: getTeacherReviews
      responses:
        "200":
          description: Qualification reviewer queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeacherReview" } }
  /mateen/admin/teachers/{userId}/decision:
    post:
      operationId: decideTeacherApplication
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionInput" }
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReview" }
  /mateen/admin/sources:
    get:
      operationId: getSourceReviews
      responses:
        "200":
          description: Versioned Nawawi source review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceVersion" } }
    post:
      operationId: createSourceVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceVersionInput" }
      responses:
        "201":
          description: New unapproved immutable version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/sources/{versionId}/decision:
    post:
      operationId: decideSourceVersion
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceDecisionInput" }
      responses:
        "200":
          description: Scientific and rights decision on exact version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/audit:
    get:
      operationId: getReviewAudit
      responses:
        "200":
          description: Authorized append only review history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
  /mateen/catalog:
    get:
      operationId: getCatalog
      responses:
        "200":
          description: First-release catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogText" }
  /mateen/texts/{textId}:
    get:
      operationId: getStudyText
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available text and source records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyText" }
  /mateen/profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Current authenticated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /mateen/progress:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Own study progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/progress/{textId}:
    put:
      operationId: saveProgress
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressInput" }
      responses:
        "200":
          description: Saved progress, not an assessment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Actual study summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /mateen/scholars:
    get:
      operationId: getScholars
      responses:
        "200":
          description: Approved public teachers only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scholar" }
  /mateen/referrals:
    get:
      operationId: getReferrals
      responses:
        "200":
          description: Own referrals only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
  /mateen/teacher:
    get:
      operationId: getTeacher
      responses:
        "200":
          description: Own teacher application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
    put:
      operationId: saveTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherInput" }
      responses:
        "200":
          description: Saved application; approval cannot be self-assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Honest release readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CatalogText:
      type: object
      required: [id, title, track, level, status, description, hadithCount]
      properties:
        id: { type: string }
        title: { type: string }
        track: { type: string }
        level: { type: string }
        status: { type: string, enum: [available, coming_soon] }
        description: { type: string }
        hadithCount: { type: integer }
    Hadith:
      type: object
      required: [id, number, title, text, sourceUrl, sourcePage]
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        text: { type: string }
        sourceUrl: { type: string }
        sourcePage: { type: integer }
        sourceVersionId: { type: string }
        reviewStatus: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
        viewerPage: { type: integer }
    StudyText:
      type: object
      required: [id, title, author, sourceUrl, sourceStatus, hadiths]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        sourceUrl: { type: string }
        sourceStatus: { type: string, enum: [retrieved_pending_review, approved, unavailable] }
        hadiths:
          type: array
          items: { $ref: "#/components/schemas/Hadith" }
    Profile:
      type: object
      required: [id, name, role, onboarded]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher] }
        onboarded: { type: boolean }
    ProfileInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        role: { type: string, enum: [student, teacher] }
    ProgressInput:
      type: object
      required: [currentHadith, completedIds, bookmarkedIds]
      properties:
        currentHadith: { type: integer, minimum: 1, maximum: 42 }
        completedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
        bookmarkedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
    StudyProgress:
      type: object
      required: [textId, currentHadith, completedIds, bookmarkedIds, updatedAt]
      properties:
        textId: { type: string }
        currentHadith: { type: integer }
        completedIds:
          type: array
          items: { type: integer }
        bookmarkedIds:
          type: array
          items: { type: integer }
        updatedAt: { type: string }
    Dashboard:
      type: object
      required: [studiedCount, totalCount, bookmarkedCount, lastHadith, lastStudiedAt]
      properties:
        studiedCount: { type: integer }
        totalCount: { type: integer }
        bookmarkedCount: { type: integer }
        lastHadith: { type: integer }
        lastStudiedAt: { type: [string, "null"] }
    Scholar:
      type: object
      required: [id, name, biography, specialties, available]
      properties:
        id: { type: string }
        name: { type: string }
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
    Referral:
      type: object
      required: [id, question, reason, status, createdAt]
      properties:
        id: { type: string }
        question: { type: string }
        reason: { type: string }
        status: { type: string }
        createdAt: { type: string }
    TeacherInput:
      type: object
      required: [biography, specialties, available]
      properties:
        biography: { type: string, maxLength: 2000 }
        specialties: { type: string, maxLength: 300 }
        available: { type: boolean }
    TeacherApplication:
      type: object
      required: [biography, specialties, available, status]
      properties:
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
        status: { type: string, enum: [draft, pending_review, approved, needs_information, rejected] }
        revision: { type: integer }
        reason: { type: string }
        submittedAt: { type: ["string", "null"] }
        documents: { type: array, items: { $ref: "#/components/schemas/QualificationDocument" } }
        history: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
    ReviewAccess:
      type: object
      required: [contentReviewer, qualificationReviewer, verifiedEmail, mfaEnabled, secureSession]
      properties:
        contentReviewer: { type: boolean }
        qualificationReviewer: { type: boolean }
        verifiedEmail: { type: boolean }
        mfaEnabled: { type: boolean }
        secureSession: { type: boolean }
    RevisionInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    QualificationUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        kind: { type: string, enum: [qualification, ijaza] }
    QualificationUpload:
      type: object
      required: [documentId, uploadURL]
      properties:
        documentId: { type: string }
        uploadURL: { type: string }
    QualificationDocument:
      type: object
      required: [id, name, kind, size, contentType, status, uploadedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [qualification, ijaza] }
        size: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [uploading, clean, rejected] }
        uploadedAt: { type: string }
    ReviewDecisionInput:
      type: object
      additionalProperties: false
      required: [revision, decision, reason]
      properties:
        revision: { type: integer, minimum: 0 }
        decision: { type: string, enum: [approved, needs_information, rejected] }
        reason: { type: string, minLength: 5, maxLength: 2000 }
    TeacherReview:
      allOf:
        - { $ref: "#/components/schemas/TeacherApplication" }
        - type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
    SourceVersionInput:
      type: object
      additionalProperties: false
      required: [hadithNumber, text, printedPage, viewerPage, viewerUrl, edition, changeReason, rightsEvidence, rightsUrl]
      properties:
        hadithNumber: { type: integer, minimum: 1, maximum: 42 }
        text: { type: string, minLength: 10, maxLength: 12000 }
        printedPage: { type: integer, minimum: 1 }
        viewerPage: { type: integer, minimum: 1 }
        viewerUrl: { type: string, format: uri, maxLength: 1000 }
        edition: { type: string, minLength: 3, maxLength: 1000 }
        changeReason: { type: string, minLength: 5, maxLength: 2000 }
        rightsEvidence: { type: string, maxLength: 4000 }
        rightsUrl: { type: string, maxLength: 1000 }
    SourceVersion:
      allOf:
        - { $ref: "#/components/schemas/SourceVersionInput" }
        - type: object
          required: [id, version, status, scientificStatus, rightsStatus, createdAt, createdBy, history]
          properties:
            id: { type: string }
            version: { type: integer }
            status: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
            scientificStatus: { type: string, enum: [pending, approved, rejected] }
            rightsStatus: { type: string, enum: [pending, cleared, rejected] }
            createdAt: { type: string }
            createdBy: { type: string }
            history: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
    SourceDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, scientificStatus, rightsStatus, reason]
      properties:
        decision: { type: string, enum: [approved, rejected, withdrawn] }
        scientificStatus: { type: string, enum: [approved, rejected, pending] }
        rightsStatus: { type: string, enum: [cleared, rejected, pending] }
        reason: { type: string, minLength: 5, maxLength: 2000 }
    ReviewAudit:
      type: object
      required: [id, actorId, action, targetId, reason, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetId: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    Capabilities:
      type: object
      required: [voiceReady, assistantReady, examsReady, sourceStatus, notice]
      properties:
        voiceReady: { type: boolean }
        assistantReady: { type: boolean }
        examsReady: { type: boolean }
        sourceStatus: { type: string }
        notice: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

