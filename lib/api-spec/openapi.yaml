openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mateen/review-access:
    get:
      operationId: getReviewAccess
      responses:
        "200":
          description: Server verified permissions and account protections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewAccess" }
  /mateen/teacher/documents/upload:
    post:
      operationId: requestQualificationUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationUploadInput" }
      responses:
        "200":
          description: Short lived direct private upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationUpload" }
  /mateen/teacher/documents/{documentId}/complete:
    post:
      operationId: completeQualificationUpload
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Validated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationDocument" }
  /mateen/teacher/documents/{documentId}:
    delete:
      operationId: removeQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed from next submission }
  /mateen/documents/{documentId}/download:
    get:
      operationId: downloadQualificationDocument
      parameters:
        - { in: path, name: documentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Protected attachment bytes, never public
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /mateen/teacher/submit:
    post:
      operationId: submitTeacherApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionInput" }
      responses:
        "200":
          description: Submitted application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/admin/teachers:
    get:
      operationId: getTeacherReviews
      responses:
        "200":
          description: Qualification reviewer queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeacherReview" } }
  /mateen/admin/teachers/{userId}/decision:
    post:
      operationId: decideTeacherApplication
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionInput" }
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReview" }
  /mateen/admin/sources:
    get:
      operationId: getSourceReviews
      responses:
        "200":
          description: Versioned Nawawi source review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceVersion" } }
    post:
      operationId: createSourceVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceVersionInput" }
      responses:
        "201":
          description: New unapproved immutable version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/sources/{versionId}/decision:
    post:
      operationId: decideSourceVersion
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceDecisionInput" }
      responses:
        "200":
          description: Scientific and rights decision on exact version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceVersion" }
  /mateen/admin/audit:
    get:
      operationId: getReviewAudit
      responses:
        "200":
          description: Authorized append only review history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
  /mateen/catalog:
    get:
      operationId: getCatalog
      responses:
        "200":
          description: First-release catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogText" }
  /mateen/texts/{textId}:
    get:
      operationId: getStudyText
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available text and source records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyText" }
  /mateen/profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Current authenticated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /mateen/progress:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Own study progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/progress/{textId}:
    put:
      operationId: saveProgress
      parameters:
        - in: path
          name: textId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressInput" }
      responses:
        "200":
          description: Saved progress, not an assessment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProgress" }
  /mateen/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Actual study summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /mateen/scholars:
    get:
      operationId: getScholars
      responses:
        "200":
          description: Approved public teachers only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scholar" }
  /mateen/referrals:
    get:
      operationId: getReferrals
      responses:
        "200":
          description: Own referrals only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
  /mateen/teacher:
    get:
      operationId: getTeacher
      responses:
        "200":
          description: Own teacher application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
    put:
      operationId: saveTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherInput" }
      responses:
        "200":
          description: Saved application; approval cannot be self-assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApplication" }
  /mateen/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Honest release readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
  /mateen/assistant/questions:
    get:
      operationId: getMateenAssistantQuestions
      responses:
        "200":
          description: Current student's persisted assistant questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantQuestion" }
    post:
      operationId: askMateenAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantQuestionInput" }
      responses:
        "201":
          description: Persisted grounded answer or abstention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantQuestion" }
        "503": { description: Assistant disabled or not ready }
  /mateen/assistant/readiness:
    get:
      operationId: getMateenAssistantReadiness
      responses:
        "200":
          description: Assistant provider, source and evaluation gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/assistant/questions/{questionId}/referral-preview:
    get:
      operationId: getMateenReferralPreview
      parameters:
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Explicit share preview and available approved teachers; nothing is shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralPreview" }
        "404": { description: Own persisted abstained assistant question not found }
  /mateen/assistant/questions/{questionId}/referral:
    post:
      operationId: referMateenAssistantQuestion
      parameters:
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralConsentInput" }
      responses:
        "201":
          description: Referral created after explicit consent and transactional teacher revalidation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReferralSummary" }
        "409": { description: Teacher unavailable or referral already exists }
  /mateen/conversations:
    get:
      operationId: getMateenConversations
      responses:
        "200":
          description: Conversations visible to current participant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyConversation" }
  /mateen/conversations/{conversationId}/messages:
    get:
      operationId: getMateenConversationMessages
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owned conversation messages and citations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyMessage" }
        "404": { description: Conversation not found }
    post:
      operationId: sendMateenFollowUp
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Persisted participant message and assistant response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantQuestion" }
        "404": { description: Conversation not found }
  /mateen/conversations/{conversationId}/status:
    get:
      operationId: getMateenConversationStatus
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation and referral polling state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationStatus" }
        "404": { description: Conversation not found }
  /mateen/teacher/referrals:
    get:
      operationId: getMateenTeacherReferrals
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, answered, closed] }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Referrals assigned to current approved teacher
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherReferral" }
  /mateen/teacher/referrals/{referralId}/status:
    patch:
      operationId: updateMateenReferralStatus
      parameters:
        - in: path
          name: referralId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralStatusInput" }
      responses:
        "200":
          description: Referral status changed without deleting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherReferral" }
        "404": { description: Referral not found }
  /mateen/teacher/referrals/{referralId}/messages:
    post:
      operationId: replyMateenReferral
      parameters:
        - in: path
          name: referralId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMessageInput" }
      responses:
        "201":
          description: Teacher text reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyMessage" }
        "404": { description: Referral not found }
  /mateen/notifications:
    get:
      operationId: getMateenNotifications
      responses:
        "200":
          description: Current user's scholarly notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyNotification" }
  /mateen/notifications/state:
    get:
      operationId: getMateenNotificationState
      responses:
        "200":
          description: Notification polling cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /mateen/notifications/{notificationId}/read:
    patch:
      operationId: markMateenNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Own notification marked as read; returns refreshed polling state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
        "404": { description: Notification not found }
  /mateen/admin/scholarly/sources:
    get:
      operationId: listScholarlySources
      responses:
        "200":
          description: Admin source/version inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlySource" }
    post:
      operationId: createScholarlySource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlySourceInput" }
      responses:
        "201":
          description: New source version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/passages:
    get:
      operationId: listScholarlyPassages
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Admin-only source passage text and distinct printed/PDF pages for review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyPassage" }
        "404": { description: Source not found }
    post:
      operationId: createScholarlyPassage
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyPassagesInput" }
      responses:
        "201": { description: Passages staged for review }
  /mateen/admin/scholarly/sources/{sourceId}/review:
    post:
      operationId: reviewScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyReviewInput" }
      responses:
        "200":
          description: Review result and index readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/index:
    post:
      operationId: indexScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIndexInput" }
      responses:
        "200":
          description: Reviewed passages indexed; corpus change invalidates evaluations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/admin/scholarly/sources/{sourceId}/withdraw:
    post:
      operationId: withdrawScholarlySource
      parameters:
        - in: path
          name: sourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyWithdrawalInput" }
      responses:
        "200":
          description: Source withdrawn from future retrieval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlySource" }
  /mateen/assistant/issues:
    post:
      operationId: reportScholarlyIssue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIssueInput" }
      responses:
        "201":
          description: Persisted own answer issue report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/issues:
    get:
      operationId: listScholarlyIssues
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, reviewed, resolved] }
      responses:
        "200":
          description: Reported answer and citation issues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/issues/{issueId}:
    patch:
      operationId: moderateScholarlyIssue
      parameters:
        - in: path
          name: issueId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyIssueModerationInput" }
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyIssue" }
  /mateen/admin/scholarly/config:
    get:
      operationId: getScholarlyConfig
      responses:
        "200":
          description: Model pin, provider readiness and evaluation gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
    put:
      operationId: updateScholarlyConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyConfigInput" }
      responses:
        "200":
          description: Audited model configuration update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/admin/scholarly/evaluations:
    post:
      operationId: recordScholarlyEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarlyEvaluationInput" }
      responses:
        "201":
          description: Evaluation record; positive evaluation enables assistant gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarlyConfig" }
  /mateen/admin/scholarly/audit:
    get:
      operationId: listScholarlyAudit
      responses:
        "200":
          description: Sensitive decisions with actor, reason and date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScholarlyAuditEvent" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mateen/recitations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRecitationPractice
      summary: Get one authenticated student's own practice record
      responses:
        "200":
          description: Own practice record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeRecitation" }
        "404": { description: Record not found }
    delete:
      operationId: deleteRecitationPractice
      summary: Cancel practice and delete its audio and derived result
      responses:
        "204": { description: Deleted; repeated deletion is idempotent }
        "404": { description: Record not found }
  /mateen/recitations/{id}/analyze:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: analyzeRecitationPractice
      summary: Finalize direct upload and request experimental local analysis
      responses:
        "200":
          description: Current practice state; repeated finalization is idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeRecitation" }
        "404": { description: Record not found }
        "409": { description: "Upload is missing, invalid, expired, or inconsistent" }
        "429": { description: Local inference queue is full }
  /mateen/assessment/policy:
    get:
      operationId: getAssessmentPolicy
      responses:
        "200":
          description: Immutable policy for the published introductory Nawawi assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentPolicy" }
  /mateen/assessments:
    post:
      operationId: startAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartAssessmentInput" }
      responses:
        "201":
          description: Created or resumed single active attempt; references hidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
        "200":
          description: Resumed own attempt with same per-tab lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
        "409": { description: Cooldown or active attempt lease conflict }
    get:
      operationId: getAssessmentSummary
      responses:
        "200":
          description: Student's own attempt summary and progression
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentAssessmentSummary" }
  /mateen/assessments/{attemptId}:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssessment
      parameters:
        - in: header
          name: X-Assessment-Session
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Own fixed attempt and public question prompts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
        "404": { description: Attempt not found }
    post:
      operationId: submitAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAssessmentInput" }
      responses:
        "200":
          description: Submitted; returns final result only when grading is complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
  /mateen/assessments/{attemptId}/heartbeat:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: heartbeatAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentHeartbeatInput" }
      responses:
        "200":
          description: Lease and server-authoritative active-time checkpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
  /mateen/assessments/{attemptId}/answers/{questionId}:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: questionId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveAssessmentAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentAnswerInput" }
      responses:
        "200":
          description: Idempotently acknowledged answer sequence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerAcknowledgement" }
        "409": { description: "Stale sequence, lease, or inactive attempt" }
  /mateen/assessments/{attemptId}/answers/{questionId}/audio:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: questionId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestAssessmentAudio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentAudioInput" }
      responses:
        "201":
          description: Private signed PUT URL, max 10 MiB and 60 seconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAudioUpload" }
    delete:
      operationId: deleteAssessmentAudio
      responses:
        "204": { description: Owner audio deleted; unreviewed answer enters technical review }
  /mateen/assessments/{attemptId}/answers/{questionId}/audio/confirm:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: questionId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmAssessmentAudio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmAssessmentAudioInput" }
      responses:
        "200":
          description: Server verified upload and acknowledged audio sequence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerAcknowledgement" }
        "409": { description: "Missing, invalid, oversized, or incomplete upload" }
        "429": { description: Bounded local audio-validation queue is full }
  /mateen/assessment/reviews:
    get:
      operationId: listScheduledReviews
      responses:
        "200":
          description: Own due spaced-repetition items with no hidden reference
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduledReview" }
  /mateen/assessment/reviews/{reviewId}/complete:
    parameters:
      - in: path
        name: reviewId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeScheduledReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteScheduledReviewInput" }
      responses:
        "200":
          description: Deterministically scored writing; audio requires human review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledReview" }
  /mateen/assessment/coverage:
    get:
      operationId: getAssessmentCoverage
      responses:
        "200":
          description: Human review coverage excluding the requesting student's own grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentCoverage" }
  /mateen/assessment/reviewer-access:
    get:
      operationId: getAssessmentReviewerAccess
      responses:
        "200":
          description: Explicit server-side assessment reviewer grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewerAccess" }
  /mateen/assessment/reviewer/queue:
    get:
      operationId: listAssessmentReviewQueue
      responses:
        "200":
          description: Bounded queue of oral answers awaiting human adjudication
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/ReviewQueueItem" }
  /mateen/assessment/reviewer/{attemptId}:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssessmentReview
      responses:
        "200":
          description: Review detail containing correct references and student audio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentReviewDetail" }
    post:
      operationId: adjudicateAssessmentOral
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentAdjudicationInput" }
      responses:
        "200":
          description: Human attestation recorded; final deterministic total produced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAttempt" }
        "409": { description: Review already adjudicated or changed concurrently }
  /mateen/assessment/reviewer/{attemptId}/audio/{questionId}:
    parameters:
      - in: path
        name: attemptId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: questionId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssessmentReviewAudio
      responses:
        "200":
          description: Private streamed audio; reviewer authorization required
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Audio not found or no longer retained }
  /mateen/recitations:
    post:
      operationId: requestRecitationPractice
      summary: Create experimental local recitation practice and private upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecitationPracticeInput" }
      responses:
        "201":
          description: Created practice and short-lived private PUT URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecitationUpload" }
        "401": { description: Authentication required }
        "403": { description: Student profile or consent required }
        "429": { description: Practice admission limit reached }
    get:
      operationId: listRecitationPractices
      summary: List the authenticated student's own practice records
      responses:
        "200":
          description: Own recitation practices
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/PracticeRecitation" }
components:
  schemas:
    CatalogText:
      type: object
      required: [id, title, track, level, status, description, hadithCount]
      properties:
        id: { type: string }
        title: { type: string }
        track: { type: string }
        level: { type: string }
        status: { type: string, enum: [available, coming_soon] }
        description: { type: string }
        hadithCount: { type: integer }
    Hadith:
      type: object
      required: [id, number, title, text, sourceUrl, sourcePage, recitationText, recitationSelection]
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string }
        text: { type: string }
        sourceUrl: { type: string }
        sourcePage: { type: integer }
        recitationText: { type: string, description: Exact canonical primary-report text for recitation and assessment. }
        recitationSelection:
          type: string
          enum: [primary-report, selected-primary-report]
        sourceVersionId: { type: string }
        reviewStatus: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
        viewerPage: { type: integer }
    StudyText:
      type: object
      required: [id, title, author, sourceUrl, sourceStatus, hadiths]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        sourceUrl: { type: string }
        sourceStatus: { type: string, enum: [retrieved_pending_review, approved, unavailable] }
        hadiths:
          type: array
          items: { $ref: "#/components/schemas/Hadith" }
    Profile:
      type: object
      required: [id, name, role, onboarded]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher] }
        onboarded: { type: boolean }
    ProfileInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        role: { type: string, enum: [student, teacher] }
    ProgressInput:
      type: object
      required: [currentHadith, completedIds, bookmarkedIds]
      properties:
        currentHadith: { type: integer, minimum: 1, maximum: 42 }
        completedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
        bookmarkedIds:
          type: array
          maxItems: 42
          items: { type: integer, minimum: 1, maximum: 42 }
    StudyProgress:
      type: object
      required: [textId, currentHadith, completedIds, bookmarkedIds, updatedAt]
      properties:
        textId: { type: string }
        currentHadith: { type: integer }
        completedIds:
          type: array
          items: { type: integer }
        bookmarkedIds:
          type: array
          items: { type: integer }
        updatedAt: { type: string }
    Dashboard:
      type: object
      required: [studiedCount, totalCount, bookmarkedCount, lastHadith, lastStudiedAt]
      properties:
        studiedCount: { type: integer }
        totalCount: { type: integer }
        bookmarkedCount: { type: integer }
        lastHadith: { type: integer }
        lastStudiedAt: { type: [string, "null"] }
    Scholar:
      type: object
      required: [id, name, biography, specialties, available]
      properties:
        id: { type: string }
        name: { type: string }
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
    Referral:
      type: object
      required: [id, question, reason, status, createdAt]
      properties:
        id: { type: string }
        question: { type: string }
        reason: { type: string }
        status: { type: string }
        createdAt: { type: string }
    TeacherInput:
      type: object
      required: [biography, specialties, available]
      properties:
        biography: { type: string, maxLength: 2000 }
        specialties: { type: string, maxLength: 300 }
        available: { type: boolean }
    TeacherApplication:
      type: object
      required: [biography, specialties, available, status]
      properties:
        biography: { type: string }
        specialties: { type: string }
        available: { type: boolean }
        status: { type: string, enum: [draft, pending_review, approved, needs_information, rejected] }
        revision: { type: integer }
        reason: { type: string }
        submittedAt: { type: ["string", "null"] }
        documents: { type: array, items: { $ref: "#/components/schemas/QualificationDocument" } }
        history: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
    ReviewAccess:
      type: object
      required: [contentReviewer, qualificationReviewer, verifiedEmail, mfaEnabled, secureSession]
      properties:
        contentReviewer: { type: boolean }
        qualificationReviewer: { type: boolean }
        verifiedEmail: { type: boolean }
        mfaEnabled: { type: boolean }
        secureSession: { type: boolean }
    RevisionInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    QualificationUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        kind: { type: string, enum: [qualification, ijaza] }
    QualificationUpload:
      type: object
      required: [documentId, uploadURL]
      properties:
        documentId: { type: string }
        uploadURL: { type: string }
    QualificationDocument:
      type: object
      required: [id, name, kind, size, contentType, status, uploadedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [qualification, ijaza] }
        size: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [uploading, clean, rejected] }
        uploadedAt: { type: string }
    ReviewDecisionInput:
      type: object
      additionalProperties: false
      required: [revision, decision, reason]
      properties:
        revision: { type: integer, minimum: 0 }
        decision: { type: string, enum: [approved, needs_information, rejected] }
        reason: { type: string, minLength: 5, maxLength: 2000 }
    TeacherReview:
      allOf:
        - { $ref: "#/components/schemas/TeacherApplication" }
        - type: object
          required: [userId, name]
          properties:
            userId: { type: string }
            name: { type: string }
    SourceVersionInput:
      type: object
      additionalProperties: false
      required: [hadithNumber, text, printedPage, viewerPage, viewerUrl, edition, changeReason, rightsEvidence, rightsUrl]
      properties:
        hadithNumber: { type: integer, minimum: 1, maximum: 42 }
        text: { type: string, minLength: 10, maxLength: 12000 }
        printedPage: { type: integer, minimum: 1 }
        viewerPage: { type: integer, minimum: 1 }
        viewerUrl: { type: string, format: uri, maxLength: 1000 }
        edition: { type: string, minLength: 3, maxLength: 1000 }
        changeReason: { type: string, minLength: 5, maxLength: 2000 }
        rightsEvidence: { type: string, maxLength: 4000 }
        rightsUrl: { type: string, maxLength: 1000 }
    SourceVersion:
      allOf:
        - { $ref: "#/components/schemas/SourceVersionInput" }
        - type: object
          required: [id, version, status, scientificStatus, rightsStatus, createdAt, createdBy, history]
          properties:
            id: { type: string }
            version: { type: integer }
            status: { type: string, enum: [pending_review, approved, rejected, withdrawn] }
            scientificStatus: { type: string, enum: [pending, approved, rejected] }
            rightsStatus: { type: string, enum: [pending, cleared, rejected] }
            createdAt: { type: string }
            createdBy: { type: string }
            history: { type: array, items: { $ref: "#/components/schemas/ReviewAudit" } }
    SourceDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, scientificStatus, rightsStatus, reason]
      properties:
        decision: { type: string, enum: [approved, rejected, withdrawn] }
        scientificStatus: { type: string, enum: [approved, rejected, pending] }
        rightsStatus: { type: string, enum: [cleared, rejected, pending] }
        reason: { type: string, minLength: 5, maxLength: 2000 }
    ReviewAudit:
      type: object
      required: [id, actorId, action, targetId, reason, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetId: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    Capabilities:
      type: object
      required: [voiceReady, assistantReady, examsReady, sourceStatus, notice]
      properties:
        voiceReady: { type: boolean }
        assistantReady: { type: boolean }
        examsReady: { type: boolean }
        sourceStatus: { type: string }
        notice: { type: string }
    RecitationPracticeInput:
      type: object
      additionalProperties: false
      required: [textId, hadithNumber, contentType, sizeBytes, consent]
      properties:
        textId: { type: string, enum: [nawawi] }
        hadithNumber: { type: integer, minimum: 1, maximum: 42 }
        contentType:
          type: string
          maxLength: 100
          pattern: '^audio/(webm|ogg|mp4|mpeg)(\s*;\s*codecs=(opus|vorbis|mp4a\.40\.2|mp3))?$'
          examples: [audio/webm, "audio/webm;codecs=opus"]
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        consent: { type: boolean, const: true }
    RecitationUpload:
      type: object
      additionalProperties: false
      required: [id, uploadUrl, expiresAt, maxDurationSeconds, retentionHours]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri, maxLength: 4096 }
        expiresAt: { type: string, format: date-time }
        maxDurationSeconds: { type: integer, const: 60 }
        retentionHours: { type: integer, const: 24 }
    PracticeRecitation:
      type: object
      additionalProperties: false
      required: [id, textId, hadithNumber, status, createdAt, expiresAt, error, result, audioDeleted]
      properties:
        id: { type: string, format: uuid }
        textId: { type: string, enum: [nawawi] }
        hadithNumber: { type: integer, minimum: 1, maximum: 42 }
        status: { type: string, enum: [uploading, processing, completed, error, deleted] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        error: { type: [string, "null"], maxLength: 300 }
        result:
          oneOf:
            - { $ref: "#/components/schemas/RecitationPracticeResult" }
            - type: "null"
        audioDeleted: { type: boolean }
    RecitationPracticeResult:
      type: object
      additionalProperties: false
      required: [transcript, referenceText, model, modelRevision, provisional, assessment, alignment]
      properties:
        transcript: { type: string, minLength: 1, maxLength: 20000 }
        referenceText: { type: string, minLength: 1, maxLength: 20000 }
        model: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9._:/-]+$' }
        modelRevision: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9._:/-]+$' }
        provisional: { type: boolean, const: true }
        assessment: { type: boolean, const: false }
        alignment:
          type: object
          additionalProperties: false
          required: [spans, approvedForAssessment, studentScore, wordErrorRate]
          properties:
            spans:
              type: array
              maxItems: 5000
              items:
                type: object
                additionalProperties: false
                required: [kind, operation, referenceWords, recognizedWords, humanReviewRequired, confirmedLearnerError]
                properties:
                  kind:
                    type: string
                    enum: [recognized_word_match_not_assessment, possible_omission, unconfirmed_passage_boundary, possible_substitution, possible_extra_words, recognizer_disagreement_not_reader_error]
                  operation: { type: string, enum: [equal, replace, insert, delete] }
                  referenceWords:
                    type: array
                    maxItems: 1000
                    items: { type: string, maxLength: 120 }
                  recognizedWords:
                    type: array
                    maxItems: 1000
                    items: { type: string, maxLength: 120 }
                  humanReviewRequired: { type: boolean }
                  confirmedLearnerError: { type: boolean, const: false }
            approvedForAssessment: { type: boolean, const: false }
            studentScore: { type: [number, "null"], const: null }
            wordErrorRate: { type: [number, "null"], const: null }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 8000 }
        textContext: { type: ["string", "null"], maxLength: 3000 }
        textId: { type: ["string", "null"], maxLength: 64 }
    ConversationMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 8000 }
        requestId: { type: string, format: uuid, description: "Stable message identifier retained when retrying a failed send." }
    Citation:
      type: object
      required: [passageId, sourceId, sourceTitle, author, edition, volume, printedPage, pdfPage, quote]
      properties:
        passageId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceTitle: { type: string }
        author: { type: string }
        edition: { type: string }
        volume: { type: ["integer", "null"] }
        printedPage: { type: ["string", "null"] }
        pdfPage: { type: ["integer", "null"] }
        quote: { type: string }
    AssistantQuestion:
      type: object
      required: [conversationId, questionId, question, textContext, createdAt, reason, status, answer, citations, referral, model]
      properties:
        conversationId: { type: string, format: uuid }
        questionId: { type: string, format: uuid }
        question: { type: string }
        textContext: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [answered, abstained, waiting_for_teacher, referred] }
        answer: { type: ["string", "null"] }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        referral: { $ref: "#/components/schemas/TeacherReferralSummary" }
        model: { type: string }
    TeacherReferralSummary:
      type: object
      required: [status, teacherName]
      properties:
        status: { type: string, enum: [not_referred, awaiting_reply, waiting_for_teacher, answered] }
        teacherName: { type: ["string", "null"] }
    ReferralPreview:
      type: object
      required: [questionId, question, textContext, reason, shares, teachers]
      properties:
        questionId: { type: string, format: uuid }
        question: { type: string }
        textContext: { type: ["string", "null"] }
        reason: { type: string }
        shares:
          type: array
          items: { type: string }
        teachers:
          type: array
          items: { $ref: "#/components/schemas/AvailableTeacher" }
    AvailableTeacher:
      type: object
      required: [id, name, specialties]
      properties:
        id: { type: string }
        name: { type: string }
        specialties: { type: string }
    ReferralConsentInput:
      type: object
      required: [consent, teacherId]
      properties:
        consent: { type: boolean, const: true }
        teacherId: { type: ["string", "null"] }
    ReferralStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, answered, closed] }
    ScholarlyConversation:
      type: object
      required: [id, topic, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        topic: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    ScholarlyMessage:
      type: object
      required: [id, role, text, createdAt, citations]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [student, assistant, teacher] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
    ConversationStatus:
      type: object
      required: [conversationId, status, referral, updatedAt]
      properties:
        conversationId: { type: string, format: uuid }
        status: { type: string }
        referral: { $ref: "#/components/schemas/TeacherReferralSummary" }
        updatedAt: { type: string, format: date-time }
    TeacherReferral:
      type: object
      required: [id, conversationId, question, context, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        question: { type: string }
        context: { type: ["string", "null"] }
        reason: { type: string }
        status: { type: string, enum: [open, answered, closed] }
        createdAt: { type: string, format: date-time }
    ScholarlyNotification:
      type: object
      required: [id, type, conversationId, text, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        conversationId: { type: string, format: uuid }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    NotificationState:
      type: object
      required: [unreadCount, latestAt]
      properties:
        unreadCount: { type: integer }
        latestAt: { type: ["string", "null"], format: date-time }
    ScholarlySourceInput:
      type: object
      required: [title, author, edition, legalAuthorization, authorizationReference, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        author: { type: string, minLength: 1, maxLength: 300 }
        edition: { type: string, minLength: 1, maxLength: 300 }
        publisher: { type: ["string", "null"], maxLength: 300 }
        legalAuthorization: { type: string, enum: [public_domain, licensed, permission_granted] }
        authorizationReference: { type: string, minLength: 1, maxLength: 1000 }
        version: { type: string, minLength: 1, maxLength: 100 }
    ScholarlySource:
      type: object
      required: [id, title, author, edition, publisher, legalAuthorization, authorizationReference, version, status, passageCount, reviewedAt, indexedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        edition: { type: string }
        publisher: { type: ["string", "null"] }
        legalAuthorization: { type: string }
        authorizationReference: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, reviewed, indexed, withdrawn] }
        passageCount: { type: integer }
        reviewedAt: { type: ["string", "null"], format: date-time }
        indexedAt: { type: ["string", "null"], format: date-time }
    ScholarlyPassagesInput:
      type: object
      required: [passages]
      properties:
        passages:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 12000 }
              volume: { type: ["integer", "null"], minimum: 1 }
              printedPage: { type: ["string", "null"], maxLength: 50 }
              pdfPage: { type: ["integer", "null"], minimum: 1 }
    ScholarlyPassage:
      type: object
      required: [id, sourceId, text, volume, printedPage, pdfPage, indexed]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        text: { type: string }
        volume: { type: ["integer", "null"] }
        printedPage: { type: ["string", "null"] }
        pdfPage: { type: ["integer", "null"] }
