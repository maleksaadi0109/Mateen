kind = "web"
previewPath = "/"
title = "منصة مَتِين"
description = "الأساس الوظيفي لمنصة مَتِين: صفحة عربية، تسجيل آمن، وقارئ الأربعين النووية مع حفظ التقدم والعلامات، وملف معلم مسودة. التقييم الصوتي والمساعد العلمي والاختبارات لم تُفعّل بعد."
version = "1.0.0"
id = "artifacts/mateen-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24832

[services.development]
run = "pnpm --filter @workspace/mateen-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mateen-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/mateen-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24832"
BASE_PATH = "/"
