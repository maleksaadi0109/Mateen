kind = "web"
previewPath = "/"
title = "منصة مَتِين"
description = "منصة مَتِين لدراسة الأربعين النووية، بتدريب صوتي تجريبي، واختبارات مستوى من 30 سؤالاً مع تصحيح تحريري حتمي ومراجعة بشرية مخوّلة للإجابات الشفهية، ومراجعات متباعدة مبنية على أخطاء مصححة. المساعد العلمي لم يُفعّل بعد."
version = "1.0.0"
id = "artifacts/mateen-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24832

[services.development]
run = "pnpm --filter @workspace/mateen-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mateen-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/mateen-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24832"
BASE_PATH = "/"
